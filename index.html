<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="3Dプレーヤー">
<meta name="theme-color" content="#000000">

<title>ゴーグル3Dプレーヤー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed black stage, two eye viewports rendered by WebGL; controls float over it and hide on tap */
:root{
  --bg:#050607;
  --panel:rgba(14,17,21,.92);
  --line:#2a323b;
  --fg:#e8edf2;
  --muted:#8e9aa6;
  --accent:#7cc7ff;
  --accent-ink:#04121d;
  --font-ui:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  --font-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
body{font-family:var(--font-ui);-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000;touch-action:none}
#hud{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#vid{position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;transition:opacity .25s}
#ui.off{opacity:0}
#ui.off *{pointer-events:none!important}
.top,.panel{pointer-events:auto}

.top{display:flex;align-items:center;gap:12px;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(var(--bg),transparent)}
.brand{font-weight:700;font-size:15px;letter-spacing:.04em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis}

.btn{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:#161b21;color:var(--fg);
  border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.on{border-color:var(--accent);color:var(--accent)}
.btn:focus-visible,.seg button:focus-visible,.play:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#ui.compact .panel{display:none}
#quick{display:none;pointer-events:auto;align-self:center;margin-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);font-size:16px;padding:12px 28px;border-radius:999px}
#ui.compact #quick{display:block}
.toast{align-self:center;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:8px 14px;font-size:13px;color:var(--fg);max-width:calc(100% - 32px);text-align:center;line-height:1.5}

.panel{margin:0 auto;width:100%;max-width:820px;background:var(--panel);border-top:1px solid var(--line);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  padding-top:12px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:10px;max-height:66vh;overflow-y:auto}
@media (min-width:840px){.panel{border:1px solid var(--line);border-radius:14px;margin-bottom:12px}}

.transport{display:flex;align-items:center;gap:10px}
.play{width:44px;height:44px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;cursor:pointer;flex:none}
.play svg{width:18px;height:18px;fill:currentColor}
.time{font-family:var(--font-num);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--fg);margin-top:-8px}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--fg);border:none}

.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.label{font-size:12px;color:var(--muted);letter-spacing:.06em;min-width:4.5em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-size:13px;font-weight:700;background:transparent;color:var(--muted);border:none;padding:7px 11px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg)}

.sliders{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px}
@media (max-width:520px){.sliders{grid-template-columns:1fr}}
.sl{display:flex;align-items:center;gap:10px;min-width:0}
.val{font-family:var(--font-num);font-size:12px;width:3.6em;text-align:right;font-variant-numeric:tabular-nums}

.chip{position:relative}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:inline-block;font-size:13px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:6px 11px;color:var(--muted);cursor:pointer}
.chip input:checked+span{border-color:var(--accent);color:var(--accent)}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin:0}
@media (prefers-reduced-motion:reduce){#ui{transition:none}}
</style>

<canvas id="stage" aria-label="左右の目用のVR映像"></canvas>
<video id="vid" playsinline webkit-playsinline preload="auto"></video>

<div id="ui" class="compact">
  <header class="top">
    <div class="brand">ゴーグル3Dプレーヤー <span style="font-size:11px;color:var(--muted);font-weight:500">ver 2.6</span><small id="fname">デモ映像を表示中</small></div>
    <label class="btn primary" for="file">動画を選ぶ</label>
    <input class="vh" type="file" id="file" accept="video/mp4,.mp4,.m4v,.mov,video/*" multiple>
  </header>

  <div class="toast" id="toast">iPhoneを横向きにして、画面をドラッグすると見回せます</div>

  <button class="btn primary" id="quick">VRで見る</button>
  <section class="panel" aria-label="操作">
    <div class="transport">
      <button class="play" id="play" aria-label="再生"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 4l13 8-13 8z"/></svg></button>
      <span class="time" id="cur">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="再生位置">
      <span class="time" id="dur">0:00</span>
      <button class="btn primary" id="vr">VRで見る</button>
    </div>

    <div class="row">
      <span class="label">映像の種類</span>
      <div class="seg" role="group" aria-label="映像の種類">
        <button data-proj="eq180">VR180</button>
        <button data-proj="eq360">VR360</button>
        <button data-proj="fish">魚眼180</button>
        <button data-proj="flat">平面</button>
      </div>
    </div>
    <div class="row">
      <span class="label">左右の並び</span>
      <div class="seg" role="group" aria-label="左右の並び">
        <button data-lay="sbs">左右 SBS</button>
        <button data-lay="tb">上下 TB</button>
        <button data-lay="mono">2D</button>
      </div>
    </div>

    <div class="sliders">
      <div class="sl"><span class="label">視野の広さ</span><input type="range" id="fov" min="60" max="130" value="100"><span class="val" id="fovV">100°</span></div>
      <div class="sl"><span class="label">目の間隔</span><input type="range" id="ipd" min="-60" max="60" value="0"><span class="val" id="ipdV">0</span></div>
    </div>

    <div class="row">
      <button class="btn" id="gyro">頭の動きで見回す</button>
      <button class="btn" id="center">正面に戻す</button>
      <label class="chip"><input type="checkbox" id="swap"><span>左右入れ替え</span></label>
      <label class="chip"><input type="checkbox" id="divider" checked><span>仕切り線</span></label>
      <label class="chip"><input type="checkbox" id="loop"><span>リピート</span></label>
      <label class="chip"><input type="checkbox" id="waudio"><span>再生中表示を抑える</span></label>
      <button class="btn" id="fs">全画面</button>
      <button class="btn" id="hide">操作を隠す</button>
    </div>
    <p class="note">画面をドラッグで見回し、タップで操作パネルの表示切替。左右が逆に見えるときは「左右入れ替え」、ゆがんで見えるときは「映像の種類」を切り替えてください。</p>
  </section>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const cv=$('stage'), v=$('vid'), ui=$('ui');
  const S={proj:'eq180',lay:'sbs',fov:100,ipd:0,swap:false,divider:true,loop:false,waudio:true,vol:1};
  try{Object.assign(S,JSON.parse(localStorage.getItem('goggle3d.v2')||'{}'))}catch(e){}
  const save=()=>{try{localStorage.setItem('goggle3d.v2',JSON.stringify(S))}catch(e){}};

  let toastTimer=null;
  function toast(msg,ms){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);if(ms)toastTimer=setTimeout(()=>t.hidden=true,ms)}
  toast('動画を選んで「VRで見る」。画面をタップすると設定が出ます',5000);

  // ---------- WebGL ----------
  const gl=cv.getContext('webgl',{antialias:false,alpha:false});
  if(!gl){toast('この端末ではWebGLが使えないため表示できません');return}
  const VS='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  const FS=`precision highp float;
  uniform sampler2D tex;uniform vec2 res;uniform vec2 origin;uniform mat3 rot;uniform float tanHalf;
  uniform float eye;uniform int proj;uniform int lay;uniform float srcAspect;
  const float PI=3.14159265;
  void main(){
    vec2 p=(gl_FragCoord.xy-origin)/res*2.0-1.0;
    float aspect=res.x/res.y;
    vec3 d=normalize(rot*vec3(p.x*tanHalf*aspect,p.y*tanHalf,-1.0));
    vec2 uv=vec2(0.0);bool ok=true;
    if(proj==0){float lon=atan(d.x,-d.z);float lat=asin(clamp(d.y,-1.,1.));ok=abs(lon)<=PI*0.5;uv=vec2(lon/PI+0.5,lat/PI+0.5);}
    else if(proj==1){float lon=atan(d.x,-d.z);float lat=asin(clamp(d.y,-1.,1.));uv=vec2(lon/(2.0*PI)+0.5,lat/PI+0.5);}
    else if(proj==2){float th=acos(clamp(-d.z,-1.,1.));ok=th<=PI*0.5;float r=th/PI;float ph=atan(d.y,d.x);uv=vec2(0.5+r*cos(ph),0.5+r*sin(ph));}
    else{ok=d.z<-0.01;float t=-1.0/d.z;float W=1.8;float H=W/srcAspect;uv=vec2(d.x*t/W+0.5,d.y*t/H+0.5);ok=ok&&uv.x>=0.&&uv.x<=1.&&uv.y>=0.&&uv.y<=1.;}
    float u=uv.x,v=1.0-uv.y;
    if(lay==0){u=(clamp(u,0.001,0.999)+eye)*0.5;}else if(lay==1){v=(clamp(v,0.001,0.999)+eye)*0.5;}
    gl_FragColor=ok?texture2D(tex,vec2(u,v)):vec4(0.,0.,0.,1.);
  }`;
  function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s}
  const prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);gl.useProgram(prog);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const ap=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(ap);gl.vertexAttribPointer(ap,2,gl.FLOAT,false,0,0);
  const U={};['tex','res','origin','rot','tanHalf','eye','proj','lay','srcAspect'].forEach(n=>U[n]=gl.getUniformLocation(prog,n));
  const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.uniform1i(U.tex,0);gl.enable(gl.SCISSOR_TEST);

  // ---------- demo texture: VR180 side-by-side test scene ----------
  const demo=document.createElement('canvas');demo.width=1440;demo.height=720;
  (function drawDemo(){
    const c=demo.getContext('2d');
    const orbs=[];for(let i=0;i<16;i++)orbs.push({lon:-70+((i*53)%140),lat:-30+((i*37)%60),z:0.6+((i*0.29)%1)*2,h:190+((i*41)%90)});
    orbs.sort((a,b)=>b.z-a.z);
    for(let e=0;e<2;e++){
      const x0=e*720;
      const g=c.createLinearGradient(0,0,0,720);g.addColorStop(0,'#14324a');g.addColorStop(.5,'#0c1720');g.addColorStop(.5,'#151515');g.addColorStop(1,'#303030');
      c.fillStyle=g;c.fillRect(x0,0,720,720);
      c.strokeStyle='rgba(124,199,255,.35)';c.lineWidth=1.5;
      for(let lon=-90;lon<=90;lon+=15){const x=x0+(lon/180+.5)*720;c.beginPath();c.moveTo(x,0);c.lineTo(x,720);c.stroke()}
      for(let lat=-75;lat<=75;lat+=15){const y=(.5-lat/180)*720;c.beginPath();c.moveTo(x0,y);c.lineTo(x0+720,y);c.stroke()}
      const sign=e===0?1:-1;
      for(const o of orbs){
        const disp=sign*14*(1/o.z-0.5);
        const x=x0+(o.lon/180+.5)*720+disp, y=(.5-o.lat/180)*720, r=26/o.z;
        const gg=c.createRadialGradient(x-r*.35,y-r*.35,r*.1,x,y,r);gg.addColorStop(0,`hsl(${o.h} 90% 80%)`);gg.addColorStop(1,`hsl(${o.h} 70% 30%)`);
        c.fillStyle=gg;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();
      }
      c.fillStyle='#e8edf2';c.textAlign='center';c.font='700 34px "Hiragino Sans",sans-serif';
      c.fillText('デモ映像',x0+360,400);c.font='500 20px "Hiragino Sans",sans-serif';c.fillText('ドラッグで見回せます',x0+360,432);
    }
  })();
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,demo);

  let dpr=1;
  function resize(){dpr=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr)}
  addEventListener('resize',resize);resize();

  // ---------- view direction ----------
  let yaw=0,pitch=0,gyroOn=false,gq=null,yawOffset=0;
  function matYawPitch(y,p){const cy=Math.cos(y),sy=Math.sin(y),cp=Math.cos(p),sp=Math.sin(p);
    // R = Ry(y)*Rx(p); column-major
    return [cy,0,-sy, sy*sp,cp,cy*sp, sy*cp,-sp,cy*cp];}
  function qmul(a,b){return[a[3]*b[0]+a[0]*b[3]+a[1]*b[2]-a[2]*b[1],a[3]*b[1]-a[0]*b[2]+a[1]*b[3]+a[2]*b[0],a[3]*b[2]+a[0]*b[1]-a[1]*b[0]+a[2]*b[3],a[3]*b[3]-a[0]*b[0]-a[1]*b[1]-a[2]*b[2]]}
  function qmat(q){const[x,y,z,w]=q;return[1-2*(y*y+z*z),2*(x*y+z*w),2*(x*z-y*w), 2*(x*y-z*w),1-2*(x*x+z*z),2*(y*z+x*w), 2*(x*z+y*w),2*(y*z-x*w),1-2*(x*x+y*y)]}
  function mmul(a,b){const r=new Array(9);for(let c=0;c<3;c++)for(let rr=0;rr<3;rr++){let s=0;for(let k=0;k<3;k++)s+=a[k*3+rr]*b[c*3+k];r[c*3+rr]=s}return r}
  function screenAngle(){return((screen.orientation&&screen.orientation.angle)||window.orientation||0)*Math.PI/180}
  function onOrient(ev){
    if(ev.alpha==null)return;
    const D=Math.PI/180,x=ev.beta*D,y=ev.alpha*D,z=-ev.gamma*D;
    const c1=Math.cos(x/2),c2=Math.cos(y/2),c3=Math.cos(z/2),s1=Math.sin(x/2),s2=Math.sin(y/2),s3=Math.sin(z/2);
    let q=[s1*c2*c3+c1*s2*s3,c1*s2*c3-s1*c2*s3,c1*c2*s3-s1*s2*c3,c1*c2*c3+s1*s2*s3];
    q=qmul(q,[-Math.SQRT1_2,0,0,Math.SQRT1_2]);
    const o=-screenAngle()/2;q=qmul(q,[0,0,Math.sin(o),Math.cos(o)]);
    gq=q;
  }
  function headingOf(m){return Math.atan2(-m[6],-m[8])} // yaw of forward vector
  function currentRot(){
    if(gyroOn&&gq){const g=qmat(gq);return mmul(matYawPitch(yawOffset,0),g)}
    return matYawPitch(yaw,pitch);
  }
  $('center').addEventListener('click',()=>{
    if(gyroOn&&gq){const g=qmat(gq);const f=[-g[6],-g[7],-g[8]];yawOffset=-Math.atan2(-f[0],-f[2])}
    else{yaw=0;pitch=0}
  });

  const NO_SENSOR='このページでは傾きセンサーが使えません。Safariで開いた版（https）でお使いください';
  function startGyro(){
    return new Promise(async resolve=>{
      if(gyroOn)return resolve(true);
      let granted=true;
      try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){granted=(await DeviceOrientationEvent.requestPermission())==='granted'}}catch(e){granted=false}
      if(!granted){toast(NO_SENSOR,6000);return resolve(false)}
      gq=null;addEventListener('deviceorientation',onOrient);
      setTimeout(()=>{
        if(!gq){removeEventListener('deviceorientation',onOrient);toast(NO_SENSOR,6000);return resolve(false)}
        gyroOn=true;$('gyro').classList.add('on');$('gyro').textContent='頭の動き：オン';
        const g=qmat(gq);const f=[-g[6],-g[7],-g[8]];yawOffset=-Math.atan2(-f[0],-f[2]);
        resolve(true);
      },800);
    });
  }
  $('gyro').addEventListener('click',()=>{
    if(gyroOn){gyroOn=false;removeEventListener('deviceorientation',onOrient);$('gyro').classList.remove('on');$('gyro').textContent='頭の動きで見回す';return}
    startGyro();
  });
  $('quick').addEventListener('click',()=>$('vr').click());
  $('vr').addEventListener('click',async()=>{
    audioUnlock();
    if(hasVideo&&v.paused){v.muted=false;v.play().then(lockWake).catch(()=>{})}
    const ok=await startGyro();
    if(ok){toast('正面を向いた状態で始まります。見失ったら画面をタップ→「正面に戻す」',4000);setTimeout(()=>showUI(false),1200)}
  });

  // ---------- drag & tap ----------
  let drag=null;
  cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,moved:false};cv.setPointerCapture(e.pointerId)});
  cv.addEventListener('pointermove',e=>{
    if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(!drag.moved&&Math.hypot(dx,dy)<6)return;drag.moved=true;drag.x=e.clientX;drag.y=e.clientY;
    const k=(S.fov*Math.PI/180)/innerHeight;
    if(gyroOn)yawOffset+=dx*k;else{yaw+=dx*k;pitch=Math.max(-1.45,Math.min(1.45,pitch+dy*k))}
  });
  const endDrag=()=>{if(drag&&!drag.moved){if(ui.classList.contains('compact')){ui.classList.remove('compact');showUI(true)}else showUI(ui.classList.contains('off'))}drag=null};
  cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',()=>drag=null);

  // ---------- UI ----------
  function syncUI(){
    document.querySelectorAll('[data-proj]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.proj===S.proj));
    document.querySelectorAll('[data-lay]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lay===S.lay));
    $('fov').value=S.fov;$('fovV').textContent=S.fov+'°';
    $('ipd').value=S.ipd;$('ipdV').textContent=(S.ipd>0?'+':'')+S.ipd;
    $('swap').checked=S.swap;$('divider').checked=S.divider;$('loop').checked=S.loop;v.loop=S.loop;$('waudio').checked=S.waudio;
  }
  syncUI();

    c.font=`500 22px ${JP}`;c.fillStyle=MUTED;
    c.fillText(flashT>0?flashMsg:(pages>1?`${page+1} / ${pages} ページ ・ `:'')+'動画を1.5秒見つめると再生',600,665);
  }
  function drawPanel(){
    const c=px;c.clearRect(0,0,CW,CH);
    // no backdrop: controls float directly over the video, with a soft shadow for legibility
    c.shadowColor='rgba(0,0,0,0.9)';c.shadowBlur=12;c.shadowOffsetY=2;
    c.textBaseline='middle';
    if(panelView==='list'){drawList(c);if(gazeUV){c.beginPath();c.arc(gazeUV[0],gazeUV[1],9,0,Math.PI*2);c.fillStyle='#fff';c.fill();c.lineWidth=3;c.strokeStyle='rgba(0,0,0,.6)';c.stroke()}return}
    // zoom & eye-distance sliders
    const bar=(l,r_,f)=>{rr(c,l,94,r_-l,12,6);c.fillStyle=TRACK;c.fill();rr(c,l,94,(r_-l)*clamp01(f),12,6);c.fillStyle=ACC;c.fill();c.beginPath();c.arc(l+(r_-l)*clamp01(f),100,13,0,Math.PI*2);c.fillStyle=FG;c.fill()};
    c.fillStyle=MUTED;c.font=`500 24px ${JP}`;c.textAlign='center';
    c.fillText('ズーム',195,52);c.fillText('目の間隔 '+(S.ipd>0?'+':'')+S.ipd,545,52);c.fillText('音量 '+Math.round(S.vol*100),895,52);
    bar(105,285,(130-S.fov)/70);bar(455,635,(S.ipd+60)/120);bar(805,985,S.vol);
    {const sb={zbar:[105,285],ibar:[455,635],vbar:[805,985]}[hoverId];
     if(sb){const x=sb[0]+(sb[1]-sb[0])*seekFrac;c.fillStyle=ACC;c.fillRect(x-3,80,6,40);ring(c,x,100,26,hoverT/DWELL);
       const val=hoverId==='zbar'?Math.round(130-seekFrac*70)+'°':hoverId==='ibar'?((n=>(n>0?'+':'')+n)(Math.round(seekFrac*120-60))):String(Math.round(seekFrac*20)*5);
       c.fillStyle=FG;c.font=`700 24px ${JP}`;c.textAlign='center';c.fillText(val,x,146);c.font=`500 24px ${JP}`;c.fillStyle=MUTED}}
    for(const g of REG){
      if(g.w)continue;
      const hov=hoverId===g.id;
      c.beginPath();c.arc(g.cx,g.cy,g.r,0,Math.PI*2);
      if(hov){c.fillStyle='rgba(124,199,255,0.22)';c.fill()}
      if(g.id==='play'||hov){c.strokeStyle=hov?ACC:FG;c.lineWidth=g.id==='play'?5:3;c.stroke()}
      icon(c,g.id,g.cx,g.cy,g.r);
      if(hov&&!g.cont)ring(c,g.cx,g.cy,g.r+10,hoverT/DWELL);
      if(g.cy===BY){c.fillStyle=FG;c.font=`600 25px ${JP}`;c.textAlign='center';
        c.fillText(g.id==='play'?(hasVideo&&!v.paused?'一時停止':'再生'):LABEL[g.id],g.cx,g.cy+g.r+34)}
    }
    // title
    c.textAlign='left';c.fillStyle=FG;c.font=`700 32px ${JP}`;
    let t=$('fname').textContent||'';while(t.length>1&&c.measureText(t).width>1000)t=t.slice(0,-2)+'…';
    c.fillText(t,60,180);
    // seek bar
    const dur=hasVideo&&v.duration?v.duration:0, cur=dur?v.currentTime/dur:0;
    rr(c,60,244,1080,12,6);c.fillStyle=TRACK;c.fill();rr(c,60,244,1080*cur,12,6);c.fillStyle=ACC;c.fill();
    c.fillStyle=MUTED;c.font=`500 24px ${JP}`;c.fillText(fmt(dur?v.currentTime:0)+' / '+fmt(dur),60,292);
    if(hoverId==='seek'){
      const sx=60+1080*seekFrac;c.fillStyle=FG;c.fillRect(sx-3,228,6,44);ring(c,sx,250,30,hoverT/DWELL);
      c.textAlign='center';c.fillStyle=FG;c.font=`700 26px ${JP}`;c.fillText(fmt(seekFrac*dur),Math.max(110,Math.min(1090,sx)),300);
    }
    // hint & flash
    c.textAlign='center';c.font=`500 22px ${JP}`;c.fillStyle=MUTED;
    c.fillText(flashT>0?flashMsg:'項目を1.5秒見つめると決定 ・ パネルの外を1.5秒見ると閉じます',CW/2,650);
    // gaze cursor
    if(gazeUV){c.beginPath();c.arc(gazeUV[0],gazeUV[1],9,0,Math.PI*2);c.fillStyle='#fff';c.fill();c.lineWidth=3;c.strokeStyle='rgba(0,0,0,.6)';c.stroke()}
  }
  function drawHud(half,H){
    hx.clearRect(0,0,hud.width,hud.height);
    const showRet=!panelOpen&&upT>0.15, showFlash=!panelOpen&&flashT>0;
    if(!showRet&&!showFlash)return;
    const s=Math.min(half,H)/12;
    for(let e=0;e<2;e++){
      const x0=e*half,cx=x0+(e===0?1:-1)*S.ipd*dpr+half/2,cy=H/2;
      hx.save();hx.beginPath();hx.rect(x0,0,half,H);hx.clip();
      if(showRet){hx.fillStyle='#fff';hx.beginPath();hx.arc(cx,cy,Math.max(3,s*0.12),0,Math.PI*2);hx.fill();
        hx.strokeStyle=ACC;hx.lineWidth=Math.max(3,s*0.12);hx.beginPath();hx.arc(cx,cy,s*0.6,-Math.PI/2,-Math.PI/2+(upT/UP_TIME)*Math.PI*2);hx.stroke()}
      if(showFlash){hx.fillStyle='rgba(12,14,18,.85)';hx.fillRect(cx-s*3,cy-s*3.4,s*6,s*1.1);hx.fillStyle=FG;hx.textAlign='center';hx.textBaseline='middle';
        hx.font=`700 ${Math.round(s*0.5)}px ${JP}`;hx.fillText(flashMsg,cx,cy-s*2.85)}
      hx.restore();
    }
  }

  // ---- panel GL program ----
  const VS2=`attribute vec2 q;uniform vec3 pc,pr,pu,eyePos;uniform mat3 rot;uniform float f,aspect;varying vec2 vuv;
  void main(){vuv=q;vec3 p=pc+pr*(q.x*2.0-1.0)+pu*(1.0-q.y*2.0);vec3 k=(p-eyePos)*rot;gl_Position=vec4(k.x*f/aspect,k.y*f,0.0,-k.z);}`;
  const FS2=`precision mediump float;uniform sampler2D t;varying vec2 vuv;void main(){gl_FragColor=texture2D(t,vuv);}`;
  const prog2=gl.createProgram();gl.attachShader(prog2,sh(gl.VERTEX_SHADER,VS2));gl.attachShader(prog2,sh(gl.FRAGMENT_SHADER,FS2));gl.linkProgram(prog2);
  const U2={};['pc','pr','pu','eyePos','rot','f','aspect','t'].forEach(n=>U2[n]=gl.getUniformLocation(prog2,n));
  const aq=gl.getAttribLocation(prog2,'q');
  const qbuf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,qbuf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([0,0,1,0,0,1,1,1]),gl.STATIC_DRAW);
  const ptex=gl.createTexture();gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,ptex);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);

  let lastTs=0,panelTick=0;
  function frame(ts){
    const dt=lastTs?Math.min(0.1,(ts-lastTs)/1000):0;lastTs=ts||0;
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);
    if(hasVideo&&v.readyState>=2){try{gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,v)}catch(e){}}
    const W=cv.width,H=cv.height,half=Math.floor(W/2),tanHalf=Math.tan(S.fov*Math.PI/360);
    const R=currentRot();
    if(hud.width!==W||hud.height!==H){hud.width=W;hud.height=H}
    updateGaze(dt,R);
    drawHud(half,H);
    if(panelOpen&&(panelTick++%2===0)){drawPanel();gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,ptex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,pc);gl.activeTexture(gl.TEXTURE0)}
    const Rf=new Float32Array(R);
    for(let e=0;e<2;e++){
      const x0=e*half,shift=(e===0?1:-1)*S.ipd*dpr;
      gl.scissor(x0,0,half,H);
      // video sphere
      gl.useProgram(prog);gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.vertexAttribPointer(ap,2,gl.FLOAT,false,0,0);
      gl.viewport(x0,0,half,H);
      gl.uniformMatrix3fv(U.rot,false,Rf);gl.uniform1f(U.tanHalf,tanHalf);
      gl.uniform1i(U.proj,PROJ[S.proj]);gl.uniform1i(U.lay,LAY[S.lay]);gl.uniform1f(U.srcAspect,srcAspect());
      gl.uniform2f(U.res,half,H);gl.uniform2f(U.origin,x0+shift,0);gl.uniform1f(U.eye,S.swap?1-e:e);
      gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
      // 3D panel
      if(panelOpen){
        const b=basis(),o=(e===0?-1:1)*EYE_OFF;
        gl.useProgram(prog2);gl.bindBuffer(gl.ARRAY_BUFFER,qbuf);gl.vertexAttribPointer(aq,2,gl.FLOAT,false,0,0);
        gl.viewport(x0+shift,0,half,H);
        gl.uniform3f(U2.pc,b.c[0],b.c[1],b.c[2]);gl.uniform3f(U2.pr,b.r[0]*PHW,b.r[1]*PHW,b.r[2]*PHW);gl.uniform3f(U2.pu,b.u[0]*PHH,b.u[1]*PHH,b.u[2]*PHH);
        gl.uniform3f(U2.eyePos,R[0]*o,R[1]*o,R[2]*o);gl.uniformMatrix3fv(U2.rot,false,Rf);
        gl.uniform1f(U2.f,1/tanHalf);gl.uniform1f(U2.aspect,half/H);gl.uniform1i(U2.t,1);
        gl.enable(gl.BLEND);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);gl.disable(gl.BLEND);
      }
    }
    if(S.divider){gl.viewport(0,0,W,H);gl.scissor(half-dpr,0,2*dpr,H);gl.clearColor(.11,.14,.17,1);gl.clear(gl.COLOR_BUFFER_BIT)}
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
